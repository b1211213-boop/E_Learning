<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOEIC Quest | 邁向 800 分之路</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --secondary-color: #f39c12;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
        }

        header {
            background-color: var(--primary-color);
            color: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .container {
            max-width: 1000px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        /* 進度條區域 */
        .status-bar {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 15px;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .progress-circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: conic-gradient(var(--secondary-color) 75%, #eee 0);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        /* 主題任務卡片 */
        .mission-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .mission-card {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 1.5rem;
            transition: transform 0.3s ease;
            cursor: pointer;
            border: 2px solid transparent;
            position: relative;
            overflow: hidden;
        }

        .mission-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary-color);
        }

        .mission-card h3 {
            margin-top: 0;
            color: var(--primary-color);
        }

        .tag {
            font-size: 0.8rem;
            background: #eee;
            padding: 2px 8px;
            border-radius: 10px;
            margin-right: 5px;
        }

        /* 互動測驗區域 */
        .quiz-section {
            display: none; /* 預設隱藏 */
            background: white;
            padding: 2rem;
            border-radius: 15px;
            margin-top: 2rem;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
        }

        .option-btn {
            display: block;
            width: 100%;
            text-align: left;
            padding: 15px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: none;
            cursor: pointer;
        }

        .option-btn:hover {
            background-color: #f0f7ff;
        }
    </style>
</head>
<body>

<header>
    <h1>TOEIC Quest</h1>
    <nav>
        <span>Level 42 | XP: 8400 / 10000</span>
    </nav>
</header>

<div class="container">
    <div class="status-bar">
        <div class="progress-circle">750pt</div>
        <div>
            <h2>距離目標 800 分還差 50 分！</h2>
            <p>今日建議：練習「多方電話會議」聽力場景。</p>
        </div>
    </div>

    <div class="mission-grid">
        <div class="mission-card" onclick="showQuiz('機場接機')">
            <span class="tag">Part 2 & 5</span>
            <h3>Mission 1: 國外差旅</h3>
            <p>學習如何預訂飯店、處理交通延誤及報帳流程。</p>
            <progress value="80" max="100" style="width: 100%;"></progress>
        </div>

        <div class="mission-card" onclick="showQuiz('會議簡報')">
            <span class="tag">Part 4 & 7</span>
            <h3>Mission 2: 季度財報會議</h3>
            <p>掌握圖表分析、市場趨勢描述與問答環節。</p>
            <progress value="30" max="100" style="width: 100%;"></progress>
        </div>

        <div class="mission-card" onclick="showQuiz('物流與供應鏈')">
            <span class="tag">Part 3 & 6</span>
            <h3>Mission 3: 物流與採購</h3>
            <p>處理庫存短缺、交貨延遲與供應商談判。</p>
            <progress value="0" max="100" style="width: 100%;"></progress>
        </div>
    </div>

    <div id="quiz" class="quiz-section">
        <h2 id="quiz-title">主題練習</h2>
        <p id="question"><strong>Question:</strong>
